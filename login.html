<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D-TEL | Sign In & Register</title>
  <meta name="description" content="Sign in or create your D-TEL customer and admin account.">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">

  <style>
    /* Full-page background layout matching images */
    body.auth-page-body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #1b202e 0%, #0d1017 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
    }

    /* Background Ambient Lights */
    .auth-bg-ambient {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(249, 87, 56, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.06) 0%, transparent 40%);
      z-index: 0;
    }

    /* Top Left Floating Brand Header */
    .auth-page-top-brand {
      position: absolute;
      top: 28px;
      left: 36px;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      text-decoration: none;
      z-index: 10;
    }

    .auth-brand-badge-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff5722, #f95738);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 1.3rem;
      box-shadow: 0 4px 15px rgba(249, 87, 56, 0.45);
    }

    .auth-brand-text h3 {
      font-size: 1.15rem;
      font-weight: 900;
      color: #ffffff;
      margin: 0;
      letter-spacing: 1.5px;
      line-height: 1.1;
    }

    .auth-brand-text span {
      font-size: 0.68rem;
      font-weight: 700;
      color: #f95738;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: block;
    }

    /* Main Floating Card */
    .auth-page-card {
      width: 980px;
      max-width: 95vw;
      min-height: 610px;
      border-radius: 28px;
      background: #12151e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 35px 90px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      display: flex;
      position: relative;
      z-index: 5;
      margin: 40px 0;
      transition: all 0.4s ease;
    }

    /* 2-Columns */
    .auth-card-side {
      flex: 1;
      min-width: 0;
      padding: 3rem 2.75rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Dark Form Side */
    .auth-card-form {
      background: #141722;
      color: #f8fafc;
    }

    /* Orange Hero Side */
    .auth-card-hero {
      background: linear-gradient(145deg, #ff5722 0%, #f94c25 50%, #ea3b1b 100%);
      color: #ffffff;
      text-align: center;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    /* Decorative background circles on hero side */
    .auth-card-hero::before {
      content: "";
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      border: 45px solid rgba(255, 255, 255, 0.12);
      bottom: -130px;
      left: -110px;
      pointer-events: none;
    }

    .auth-card-hero::after {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0) 70%);
      top: -60px;
      right: -60px;
      pointer-events: none;
    }

    /* 5-Dash Indicator */
    .auth-dashes {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 1.25rem;
      position: relative;
      z-index: 2;
    }

    .auth-dashes span {
      width: 22px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.35);
      display: inline-block;
    }

    .auth-dashes span.active {
      background: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }

    /* Pill Tag */
    .auth-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(0, 0, 0, 0.22);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 0.35rem 0.95rem;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      position: relative;
      z-index: 2;
    }

    /* Hero Texts */
    .auth-hero-title {
      font-size: 2.25rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.85rem;
      line-height: 1.15;
      position: relative;
      z-index: 2;
    }

    .auth-hero-subtitle {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.92);
      line-height: 1.5;
      max-width: 330px;
      margin: 0 auto 2rem auto;
      position: relative;
      z-index: 2;
    }

    .auth-hero-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.8rem 2.35rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      z-index: 2;
    }

    .auth-hero-btn:hover {
      background: #ffffff;
      color: #f95738;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transform: translateY(-2px);
    }

    .auth-quote {
      font-size: 0.82rem;
      font-style: italic;
      color: rgba(255, 255, 255, 0.8);
      position: relative;
      z-index: 2;
    }

    /* Form Styles */
    .auth-main-title {
      font-size: 1.95rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.35rem;
      line-height: 1.2;
    }

    .auth-main-desc {
      font-size: 0.88rem;
      color: #94a3b8;
      margin-bottom: 1.35rem;
      line-height: 1.4;
    }

    .auth-social-box {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.1rem;
    }

    .auth-social-button {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: #171b26;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      padding: 0.72rem;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .auth-social-button:hover {
      background: #1f2533;
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .auth-divider-line {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.15rem 0;
      color: #64748b;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .auth-divider-line::before,
    .auth-divider-line::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .auth-divider-line span {
      padding: 0 0.85rem;
    }

    .auth-field-group {
      margin-bottom: 0.95rem;
    }

    .auth-field-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 0.35rem;
    }

    .auth-field-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .auth-field-icon {
      position: absolute;
      left: 1rem;
      color: #64748b;
      font-size: 0.95rem;
      pointer-events: none;
    }

    .auth-input-element {
      width: 100%;
      background: #171b26 !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      border-radius: 12px !important;
      color: #ffffff !important;
      padding: 0.8rem 2.75rem 0.8rem 2.65rem !important;
      font-size: 0.92rem !important;
      outline: none !important;
      transition: all 0.2s ease !important;
    }

    .auth-input-element:focus {
      border-color: #f95738 !important;
      box-shadow: 0 0 0 3px rgba(249, 87, 56, 0.22) !important;
    }

    .auth-eye-toggle {
      position: absolute;
      right: 0.85rem;
      background: none;
      border: none;
      color: #64748b;
      font-size: 0.95rem;
      cursor: pointer;
      padding: 0.35rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-eye-toggle:hover {
      color: #f95738;
    }

    .auth-checkbox-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      margin: 0.4rem 0 1.25rem 0;
    }

    .auth-remember-checkbox {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.82rem;
    }

    .auth-remember-checkbox input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #f95738;
      cursor: pointer;
    }

    .auth-forgot-anchor {
      color: #f97316;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.82rem;
    }

    .auth-forgot-anchor:hover {
      color: #ea580c;
      text-decoration: underline;
    }

    .auth-cta-btn {
      width: 100%;
      background: #f95738;
      border: none;
      color: #ffffff;
      padding: 0.9rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(249, 87, 56, 0.35);
    }

    .auth-cta-btn:hover {
      background: #ff6b35;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(249, 87, 56, 0.45);
    }

    .auth-switch-text {
      text-align: center;
      margin-top: 1.15rem;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .auth-switch-text a {
      color: #f97316;
      font-weight: 700;
      text-decoration: none;
    }

    .auth-switch-text a:hover {
      text-decoration: underline;
    }

    .auth-demo-box {
      margin-top: 0.85rem;
      padding-top: 0.65rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.74rem;
      color: #64748b;
      text-align: center;
    }

    @media (max-width: 860px) {
      .auth-page-card {
        flex-direction: column;
        width: 100%;
        margin: 20px 10px;
        border-radius: 20px;
      }
      .auth-card-hero {
        display: none;
      }
      .auth-card-side {
        padding: 2.25rem 1.5rem;
      }
    }
  </style>
</head>

<body class="auth-page-body">
  <div class="auth-bg-ambient"></div>

  <!-- Top-Left Brand Logo (D-TEL CELLULAR) -->
  <a href="index.html" class="auth-page-top-brand" title="Return to Storefront">
    <div class="auth-brand-badge-box">
      <i class="fas fa-mobile-alt"></i>
    </div>
    <div class="auth-brand-text">
      <h3>D-TEL</h3>
      <span>CELLULAR & ACCESSORIES</span>
    </div>
  </a>

  <!-- Main Split-Screen Auth Card Container -->
  <main class="auth-page-card" id="authMainCard">
    <!-- Rendered dynamically by script below: Mode 1 (Sign In) or Mode 2 (Create account) -->
  </main>

  <!-- Core JavaScript Modules -->
  <script src="js/data.js?v=20260913_v3"></script>
  <script src="js/api-client.js?v=20260913_v3"></script>
  <script src="js/auth.js?v=20260913_v3"></script>

  <script>
    let currentAuthMode = 'login'; // 'login' or 'register'

    function toggleEye(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = `<i class="far fa-eye-slash" style="color:#f95738;"></i>`;
      } else {
        input.type = 'password';
        btn.innerHTML = `<i class="far fa-eye"></i>`;
      }
    }

    function renderAuthCard(mode = 'login') {
      currentAuthMode = mode;
      const card = document.getElementById('authMainCard');
      if (!card) return;

      if (mode === 'login') {
        // -------------------------------------------------------------
        // IMAGE 1: SIGN IN VIEW
        // Left: Dark Form | Right: Bright Orange Hero Card
        // -------------------------------------------------------------
        card.innerHTML = `
          <!-- LEFT: Dark Sign In Form -->
          <div class="auth-card-side auth-card-form" style="border-radius:28px 0 0 28px;">
            <div>
              <h1 class="auth-main-title">Welcome back</h1>
              <p class="auth-main-desc">Sign in to the fleet console to manage rentals and vehicles</p>

              <!-- Social Logins -->
              <div class="auth-social-box">
                <button type="button" class="auth-social-button" onclick="Auth.quickGoogleLogin()" style="width:100%;">
                  <svg viewBox="0 0 24 24" width="20" height="20">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                  </svg>
                  <span>Continue with Google</span>
                </button>
              </div>

              <div class="auth-divider-line">
                <span>or continue with email</span>
              </div>

              <!-- Alert Box -->
              <div class="auth-alert" id="pageAuthAlert"></div>

              <form onsubmit="handlePageLogin(event)" autocomplete="off">
                <!-- Prevent aggressive browser password autofill -->
                <input type="text" style="opacity:0;position:absolute;pointer-events:none;height:0;width:0;" tabindex="-1" autocomplete="off">
                <input type="password" style="opacity:0;position:absolute;pointer-events:none;height:0;width:0;" tabindex="-1" autocomplete="off">

                <div class="auth-field-group">
                  <label class="auth-field-label">Email / Username</label>
                  <div class="auth-field-box">
                    <i class="far fa-envelope auth-field-icon"></i>
                    <input type="text" id="pageLoginUser" name="dt_page_usr" class="auth-input-element" placeholder="Enter your email or username" autocomplete="new-off" readonly onfocus="this.removeAttribute('readonly')" value="" required>
                  </div>
                </div>

                <div class="auth-field-group">
                  <label class="auth-field-label">Password</label>
                  <div class="auth-field-box">
                    <i class="fas fa-lock auth-field-icon"></i>
                    <input type="password" id="pageLoginPass" name="dt_page_pwd" class="auth-input-element" placeholder="Enter your password" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')" value="" required>
                    <button type="button" class="auth-eye-toggle" onclick="toggleEye('pageLoginPass', this)">
                      <i class="far fa-eye"></i>
                    </button>
                  </div>
                </div>

                <div class="auth-checkbox-row">
                  <label class="auth-remember-checkbox">
                    <input type="checkbox" id="pageRememberMe">
                    <span>Remember me</span>
                  </label>
                  <a href="javascript:void(0)" onclick="alert('Password reset instructions sent to your email!')" class="auth-forgot-anchor">Forgot password?</a>
                </div>

                <button type="submit" id="pageLoginSubmitBtn" class="auth-cta-btn">
                  Sign in
                </button>
              </form>
            </div>

            <div>
              <div class="auth-switch-text">
                New team member? <a href="javascript:void(0)" onclick="renderAuthCard('register')">Create an account</a>
              </div>
            </div>
          </div>

          <!-- RIGHT: Bright Orange Hero Card -->
          <div class="auth-card-side auth-card-hero" style="border-radius:0 28px 28px 0;">
            <div style="width:100%;">
              <div class="auth-dashes">
                <span class="active"></span>
                <span class="active"></span>
                <span></span>
                <span></span>
                <span></span>
              </div>

              <div class="auth-pill">
                <i class="fas fa-car"></i> VELOCE RENTALS
              </div>

              <h2 class="auth-hero-title">New to the crew?</h2>
              <p class="auth-hero-subtitle">Create your operator account and put the fleet to work in minutes.</p>

              <button type="button" class="auth-hero-btn" onclick="renderAuthCard('register')">
                Create account
              </button>
            </div>

            <div class="auth-quote">
              "Life is too short to drive boring cars."
            </div>
          </div>
        `;
      } else {
        // -------------------------------------------------------------
        // IMAGE 2: CREATE ACCOUNT VIEW
        // Left: Bright Orange Hero Card | Right: Dark Form
        // -------------------------------------------------------------
        card.innerHTML = `
          <!-- LEFT: Bright Orange Hero Card -->
          <div class="auth-card-side auth-card-hero" style="border-radius:28px 0 0 28px;">
            <div style="width:100%;">
              <div class="auth-dashes">
                <span></span>
                <span></span>
                <span class="active"></span>
                <span class="active"></span>
                <span class="active"></span>
              </div>

              <div class="auth-pill">
                <i class="fas fa-crown"></i> WELCOME BACK
              </div>

              <h2 class="auth-hero-title">Back in the driver’s seat</h2>
              <p class="auth-hero-subtitle">Sign in to keep the fleet moving — rentals, returns and maintenance await.</p>

              <button type="button" class="auth-hero-btn" onclick="renderAuthCard('login')">
                Sign in
              </button>
            </div>

            <div class="auth-quote">
              "The journey, not the destination, matters."
            </div>
          </div>

          <!-- RIGHT: Dark Register Form -->
          <div class="auth-card-side auth-card-form" style="border-radius:0 28px 28px 0;">
            <div>
              <h1 class="auth-main-title">Join the crew</h1>
              <p class="auth-main-desc">Register an operator account for your rental desk</p>

              <!-- Alert Box -->
              <div class="auth-alert" id="pageAuthAlert"></div>

              <form onsubmit="handlePageRegister(event)">
                <div class="auth-field-group">
                  <label class="auth-field-label">Full name</label>
                  <div class="auth-field-box">
                    <i class="far fa-user auth-field-icon"></i>
                    <input type="text" id="pageRegName" class="auth-input-element" placeholder="Dominic Reyes" required>
                  </div>
                </div>

                <div class="auth-field-group">
                  <label class="auth-field-label">Email</label>
                  <div class="auth-field-box">
                    <i class="far fa-envelope auth-field-icon"></i>
                    <input type="email" id="pageRegEmail" class="auth-input-element" placeholder="you@veloce.rent" required>
                  </div>
                </div>

                <div class="auth-field-group">
                  <label class="auth-field-label">Password</label>
                  <div class="auth-field-box">
                    <i class="fas fa-lock auth-field-icon"></i>
                    <input type="password" id="pageRegPass" class="auth-input-element" placeholder="6+ characters" required minlength="6">
                    <button type="button" class="auth-eye-toggle" onclick="toggleEye('pageRegPass', this)">
                      <i class="far fa-eye"></i>
                    </button>
                  </div>
                </div>

                <div class="auth-field-group" style="margin-bottom:1.35rem;">
                  <label class="auth-field-label">Confirm password</label>
                  <div class="auth-field-box">
                    <i class="fas fa-shield-alt auth-field-icon"></i>
                    <input type="password" id="pageRegConfirmPass" class="auth-input-element" placeholder="Repeat your password" required minlength="6">
                    <button type="button" class="auth-eye-toggle" onclick="toggleEye('pageRegConfirmPass', this)">
                      <i class="far fa-eye"></i>
                    </button>
                  </div>
                </div>

                <button type="submit" id="pageRegSubmitBtn" class="auth-cta-btn">
                  Create account
                </button>
              </form>
            </div>

            <div class="auth-switch-text">
              Already registered? <a href="javascript:void(0)" onclick="renderAuthCard('login')">Sign in</a>
            </div>
          </div>
        `;
      }

      let flushTicks = 0;
      const flushInterval = setInterval(() => {
        const u = document.getElementById("pageLoginUser");
        const p = document.getElementById("pageLoginPass");
        if (u && document.activeElement !== u && u.hasAttribute('readonly')) u.value = "";
        if (p && document.activeElement !== p && p.hasAttribute('readonly')) p.value = "";
        flushTicks++;
        if (flushTicks > 20) clearInterval(flushInterval);
      }, 80);
    }

    async function handlePageLogin(e) {
      e.preventDefault();
      const user = document.getElementById("pageLoginUser").value.trim();
      const pass = document.getElementById("pageLoginPass").value;
      const alertEl = document.getElementById("pageAuthAlert");
      const btn = document.getElementById("pageLoginSubmitBtn");

      btn.disabled = true;
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Signing In...`;

      const res = await Auth.login(user, pass);
      btn.disabled = false;
      btn.innerHTML = `Sign in`;

      if (res.success) {
        alertEl.className = "auth-alert success";
        alertEl.innerHTML = `<i class="fas fa-check-circle"></i> ${res.role === 'admin' ? 'Admin Access Granted! Entering Admin Dashboard...' : 'Login Successful! Welcome, ' + res.user.name + '.'}`;

        setTimeout(() => {
          if (res.role === 'admin' || (res.user && res.user.role === 'admin')) {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'index.html';
          }
        }, 500);
      } else {
        alertEl.className = "auth-alert error";
        alertEl.textContent = res.message || "Invalid email or password.";
      }
    }

    async function handlePageRegister(e) {
      e.preventDefault();
      const name = document.getElementById("pageRegName").value.trim();
      const email = document.getElementById("pageRegEmail").value.trim();
      const pass = document.getElementById("pageRegPass").value;
      const confirmPass = document.getElementById("pageRegConfirmPass").value;
      const alertEl = document.getElementById("pageAuthAlert");
      const btn = document.getElementById("pageRegSubmitBtn");

      if (pass !== confirmPass) {
        alertEl.className = "auth-alert error";
        alertEl.textContent = "Passwords do not match. Please verify and repeat.";
        return;
      }

      if (pass.length < 6) {
        alertEl.className = "auth-alert error";
        alertEl.textContent = "Password must contain at least 6 characters.";
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Creating Account...`;

      const res = await Auth.registerCustomer({
        name,
        email,
        password: pass,
        phone: '0771234567',
        address: 'Colombo, Sri Lanka'
      });

      btn.disabled = false;
      btn.innerHTML = `Create account`;

      if (res.success) {
        alertEl.className = "auth-alert success";
        alertEl.innerHTML = `<i class="fas fa-check-circle"></i> Account created & saved to database! Welcome, <strong>${res.user.name}</strong>.`;

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 600);
      } else {
        alertEl.className = "auth-alert error";
        alertEl.textContent = res.message || "Registration failed. This email might already exist.";
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const initialMode = (urlParams.get('mode') === 'register' || urlParams.get('tab') === 'register') ? 'register' : 'login';
      renderAuthCard(initialMode);
    });
  </script>
</body>
</html>

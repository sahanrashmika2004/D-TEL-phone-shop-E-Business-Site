<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- Landscape Movie Watching Stand Angle -->
  <g transform="translate(10, 30)">
    <!-- Propped Up Phone in Landscape -->
    <rect x="40" y="100" width="280" height="150" rx="20" fill="#0f172a" stroke="#10b981" stroke-width="2.5"/>
    <rect x="48" y="108" width="264" height="134" rx="14" fill="#020617"/>
    <!-- Screen Movie UI -->
    <circle cx="180" cy="175" r="22" fill="#10b981"/>
    <polygon points="175,165 190,175 175,185" fill="#ffffff"/>
    <!-- Deployed Kickstand Leg Supporting Phone -->
    <polygon points="260,250 310,290 320,280 270,240" fill="#34d399"/>
    <!-- Table Shadow -->
    <ellipse cx="180" cy="285" rx="140" ry="12" fill="rgba(0,0,0,0.5)"/>
  </g>
  <!-- Label -->
  <rect x="80" y="345" width="240" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="#10b981" stroke-width="1.5"/>
  <text x="200" y="366" fill="#34d399" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">LANDSCAPE &amp; PORTRAIT STAND MODE</text>
</svg>

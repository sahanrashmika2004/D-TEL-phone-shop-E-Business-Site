<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="budsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111d" />
      <stop offset="100%" stop-color="#1a2238" />
    </linearGradient>
    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="36" fill="url(#budsBg)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <!-- Open Charging Case Base -->
  <rect x="70" y="110" width="160" height="120" rx="40" fill="#2d3748" stroke="url(#violetGlow)" stroke-width="3"/>
  <rect x="80" y="125" width="140" height="90" rx="30" fill="#1e293b"/>
  <!-- Left Earbud Cradle & Bud -->
  <circle cx="115" cy="165" r="28" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="115" cy="165" r="20" fill="url(#violetGlow)"/>
  <circle cx="115" cy="160" r="8" fill="#e2e8f0" opacity="0.6"/>
  <!-- Right Earbud Cradle & Bud -->
  <circle cx="185" cy="165" r="28" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="185" cy="165" r="20" fill="url(#violetGlow)"/>
  <circle cx="185" cy="160" r="8" fill="#e2e8f0" opacity="0.6"/>
  <!-- LED Status Indicator -->
  <circle cx="150" cy="210" r="4" fill="#34d399"/>
  <!-- Text Badge -->
  <rect x="85" y="55" width="130" height="26" rx="13" fill="rgba(168,85,247,0.15)" stroke="url(#violetGlow)" stroke-width="1.5"/>
  <text x="150" y="72" fill="#c084fc" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" text-anchor="middle" letter-spacing="1">GALAXY BUDS 2 PRO</text>
</svg>

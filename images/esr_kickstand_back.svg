<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- ESR HaloLock Case Back -->
  <rect x="95" y="30" width="210" height="340" rx="34" fill="rgba(255,255,255,0.05)" stroke="#10b981" stroke-width="2.5"/>
  <!-- Fold-Out Zinc Alloy Camera Kickstand Frame -->
  <rect x="105" y="45" width="95" height="95" rx="22" fill="#0f172a" stroke="#10b981" stroke-width="3"/>
  <rect x="110" y="50" width="85" height="85" rx="18" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="152" y="95" fill="#34d399" font-family="'Outfit', sans-serif" font-weight="900" font-size="11" text-anchor="middle">ZINC ALLOY</text>
  <text x="152" y="112" fill="#a7f3d0" font-family="'Outfit', sans-serif" font-weight="700" font-size="9" text-anchor="middle">KICKSTAND</text>
  <!-- MagSafe Magnetic Ring -->
  <circle cx="200" cy="200" r="45" fill="none" stroke="#10b981" stroke-width="3"/>
  <rect x="198" y="248" width="4" height="20" rx="2" fill="#10b981"/>
  <!-- ESR Logo -->
  <text x="200" y="325" fill="#10b981" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" letter-spacing="3" text-anchor="middle">ESR</text>
  <!-- Label -->
  <rect x="80" y="345" width="240" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="#10b981" stroke-width="1.5"/>
  <text x="200" y="366" fill="#34d399" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">PATENTED CAMERA KICKSTAND</text>
</svg>

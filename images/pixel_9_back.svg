<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pixelBar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- Phone Body -->
  <rect x="95" y="30" width="210" height="340" rx="34" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <!-- Iconic Pixel Camera Visor Bar -->
  <rect x="80" y="70" width="240" height="70" rx="35" fill="url(#pixelBar)" stroke="#64748b" stroke-width="3"/>
  <!-- Triple Camera Pill Inside Visor -->
  <rect x="105" y="85" width="125" height="40" rx="20" fill="#020617"/>
  <circle cx="130" cy="105" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="165" cy="105" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="205" cy="105" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Flash & Temp Sensor -->
  <circle cx="270" cy="95" r="7" fill="#fef08a"/>
  <circle cx="270" cy="115" r="5" fill="#475569"/>
  <!-- Google "G" Logo -->
  <circle cx="200" cy="240" r="16" fill="rgba(255,255,255,0.06)" stroke="#64748b" stroke-width="1.5"/>
  <text x="200" y="247" fill="#34a853" font-family="'Outfit', sans-serif" font-weight="900" font-size="18" text-anchor="middle">G</text>
  <!-- Label -->
  <rect x="80" y="345" width="240" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="#34a853" stroke-width="1.5"/>
  <text x="200" y="366" fill="#34a853" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">ICONIC PIXEL CAMERA VISOR</text>
</svg>

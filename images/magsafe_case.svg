<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgCase)"/>
  <!-- Case Outline -->
  <rect x="150" y="60" width="200" height="380" rx="36" fill="url(#leatherGrad)" stroke="#b45309" stroke-width="4"/>
  <!-- Camera Bump -->
  <rect x="175" y="85" width="80" height="85" rx="20" fill="#292524" stroke="#78350f" stroke-width="3"/>
  <circle cx="198" cy="108" r="14" fill="#000" stroke="#525252" stroke-width="2"/>
  <circle cx="232" cy="108" r="14" fill="#000" stroke="#525252" stroke-width="2"/>
  <circle cx="198" cy="142" r="14" fill="#000" stroke="#525252" stroke-width="2"/>
  <circle cx="235" cy="142" r="5" fill="#fef08a"/>
  <!-- MagSafe Ring -->
  <circle cx="250" cy="270" r="55" fill="none" stroke="#d97706" stroke-width="6" stroke-dasharray="12 6"/>
  <rect x="247" y="330" width="6" height="25" rx="3" fill="#d97706"/>
  <!-- Logo -->
  <circle cx="250" cy="270" r="12" fill="rgba(255,255,255,0.15)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bladeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="digitalCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="36" fill="url(#bladeBg)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <!-- Ultra-Slim Blade Power Bank Body -->
  <rect x="55" y="70" width="190" height="160" rx="18" fill="#182234" stroke="url(#digitalCyan)" stroke-width="2.5"/>
  <!-- Status Screen -->
  <rect x="75" y="90" width="150" height="50" rx="8" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
  <!-- 100W Digital Readout -->
  <text x="105" y="122" fill="#06b6d4" font-family="'Outfit', monospace" font-weight="800" font-size="22">100W</text>
  <text x="175" y="112" fill="#10b981" font-family="'Outfit', sans-serif" font-weight="700" font-size="12">98%</text>
  <text x="175" y="128" fill="#94a3b8" font-family="'Outfit', sans-serif" font-weight="500" font-size="10">20.0V / 5.0A</text>
  <!-- 4 Fast Ports -->
  <rect x="75" y="170" width="30" height="12" rx="4" fill="#0284c7"/>
  <rect x="115" y="170" width="30" height="12" rx="4" fill="#0284c7"/>
  <rect x="155" y="170" width="30" height="12" rx="4" fill="#f59e0b"/>
  <rect x="195" y="170" width="30" height="12" rx="4" fill="#f59e0b"/>
  <!-- Baseus Blade Branding -->
  <text x="150" y="210" fill="#64748b" font-family="'Outfit', sans-serif" font-weight="700" font-size="10" text-anchor="middle" letter-spacing="1.5">BASEUS BLADE 20000MAH</text>
</svg>

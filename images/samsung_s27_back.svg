<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="s27Titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="lensRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- Chassis Back -->
  <rect x="95" y="30" width="210" height="340" rx="20" fill="url(#s27Titanium)" stroke="#475569" stroke-width="2.5"/>
  <!-- Floating Lenses Column 1 -->
  <!-- 200MP Main -->
  <circle cx="135" cy="80" r="24" fill="#0f172a" stroke="url(#lensRing)" stroke-width="3"/>
  <circle cx="135" cy="80" r="16" fill="#020617"/>
  <circle cx="132" cy="77" r="6" fill="#38bdf8" opacity="0.6"/>

  <!-- 50MP Periscope Telephoto 10X -->
  <circle cx="135" cy="140" r="24" fill="#0f172a" stroke="url(#lensRing)" stroke-width="3"/>
  <circle cx="135" cy="140" r="16" fill="#020617"/>
  <circle cx="132" cy="137" r="6" fill="#38bdf8" opacity="0.6"/>

  <!-- 12MP Ultra Wide -->
  <circle cx="135" cy="200" r="24" fill="#0f172a" stroke="url(#lensRing)" stroke-width="3"/>
  <circle cx="135" cy="200" r="16" fill="#020617"/>
  <circle cx="132" cy="197" r="6" fill="#38bdf8" opacity="0.6"/>

  <!-- Column 2 Sensors (Laser AF & 3X Telephoto) -->
  <circle cx="185" cy="80" r="14" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <circle cx="185" cy="80" r="6" fill="#ef4444"/> <!-- Laser AF -->

  <circle cx="185" cy="115" r="8" fill="#fef08a"/> <!-- Flash -->

  <circle cx="185" cy="150" r="16" fill="#0f172a" stroke="url(#lensRing)" stroke-width="2.5"/>
  <circle cx="185" cy="150" r="10" fill="#020617"/>

  <!-- Samsung Logo -->
  <text x="200" y="325" fill="#64748b" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" letter-spacing="4" text-anchor="middle">SAMSUNG</text>

  <!-- Label -->
  <rect x="80" y="350" width="240" height="28" rx="14" fill="rgba(0,0,0,0.6)" stroke="rgba(6,182,212,0.4)" stroke-width="1.5"/>
  <text x="200" y="369" fill="#38bdf8" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" text-anchor="middle" letter-spacing="1">200MP QUAD CAMERA BACK</text>
</svg>

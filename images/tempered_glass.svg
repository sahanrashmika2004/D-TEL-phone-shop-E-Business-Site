<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.7)"/>
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0.4)"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#tgBg)"/>
  <!-- Alignment Tray -->
  <rect x="130" y="60" width="240" height="380" rx="28" fill="#1e293b" stroke="#06b6d4" stroke-width="3" stroke-dasharray="10 5"/>
  <!-- Phone Screen -->
  <rect x="150" y="80" width="200" height="340" rx="22" fill="#090d16" stroke="#374151" stroke-width="2"/>
  <!-- Tempered Glass Sheet Floating -->
  <rect x="140" y="70" width="200" height="340" rx="22" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="240" cy="85" r="5" fill="#000"/>
  <!-- 9H Hardness Badge -->
  <circle cx="240" cy="240" r="45" fill="#06b6d4" opacity="0.9"/>
  <text x="240" y="248" font-family="'Outfit', sans-serif" font-size="28" font-weight="900" fill="#000" text-anchor="middle">9H</text>
  <text x="240" y="320" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">2-PACK SHIELD</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="chassis3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- 3D Perspective Phone Profile -->
  <g transform="rotate(-15 200 200) translate(20, -10)">
    <rect x="110" y="40" width="180" height="320" rx="36" fill="url(#chassis3D)" stroke="#94a3b8" stroke-width="3"/>
    <!-- Screen Glass Reflection -->
    <path d="M 125 55 L 275 55 L 275 345 L 125 345 Z" fill="#020617"/>
    <path d="M 125 55 L 230 55 L 145 345 L 125 345 Z" fill="url(#edgeGlow)" opacity="0.15"/>
    <!-- Dynamic Island Pill -->
    <rect x="175" y="70" width="50" height="14" rx="7" fill="#000" stroke="#334155" stroke-width="1"/>
    <!-- Action Button on Left Edge -->
    <rect x="105" y="100" width="5" height="18" rx="2.5" fill="#38bdf8"/>
    <!-- Volume Rockers -->
    <rect x="105" y="130" width="5" height="30" rx="2.5" fill="#94a3b8"/>
    <rect x="105" y="170" width="5" height="30" rx="2.5" fill="#94a3b8"/>
  </g>
  <!-- Label -->
  <rect x="80" y="340" width="240" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
  <text x="200" y="361" fill="#38bdf8" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">3D DYNAMIC ISLAND &amp; ACTION BUTTON</text>
</svg>

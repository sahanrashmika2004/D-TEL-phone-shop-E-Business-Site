<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ankerMatte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- Front Face of Anker 65W GaNPrime -->
  <rect x="110" y="50" width="180" height="280" rx="24" fill="url(#ankerMatte)" stroke="#06b6d4" stroke-width="2.5"/>
  <!-- IQ4 Logo -->
  <text x="200" y="90" fill="#06b6d4" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" text-anchor="middle">PowerIQ 4.0</text>
  <!-- Port 1 (USB-C1 65W Max) -->
  <rect x="150" y="115" width="100" height="34" rx="8" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="180" y="128" width="40" height="8" rx="4" fill="#06b6d4"/>
  <text x="200" y="160" fill="#94a3b8" font-family="'Outfit', sans-serif" font-weight="700" font-size="9" text-anchor="middle">USB-C 1 (65W MAX)</text>

  <!-- Port 2 (USB-C2 65W Max) -->
  <rect x="150" y="180" width="100" height="34" rx="8" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="180" y="193" width="40" height="8" rx="4" fill="#06b6d4"/>
  <text x="200" y="225" fill="#94a3b8" font-family="'Outfit', sans-serif" font-weight="700" font-size="9" text-anchor="middle">USB-C 2 (65W MAX)</text>

  <!-- Port 3 (USB-A 22.5W) -->
  <rect x="150" y="245" width="100" height="34" rx="8" fill="#020617" stroke="#06b6d4" stroke-width="1.5"/>
  <rect x="165" y="255" width="70" height="14" rx="3" fill="#06b6d4"/>
  <text x="200" y="290" fill="#94a3b8" font-family="'Outfit', sans-serif" font-weight="700" font-size="9" text-anchor="middle">USB-A (22.5W)</text>

  <!-- Label -->
  <rect x="80" y="345" width="240" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="200" y="366" fill="#06b6d4" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">3-PORT FAST CHARGING FACE</text>
</svg>

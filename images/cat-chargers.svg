<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="chargerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="200" height="200" rx="30" fill="url(#chargerBg)"/>
  <!-- Glowing Cable Arc -->
  <path d="M 40 140 Q 80 170 120 140 T 160 100" fill="none" stroke="url(#cyanGlow)" stroke-width="8" stroke-linecap="round" filter="url(#glowEffect)"/>
  <!-- Adapter Body -->
  <rect x="65" y="50" width="70" height="75" rx="14" fill="#334155" stroke="#06b6d4" stroke-width="3"/>
  <rect x="80" y="30" width="10" height="20" rx="3" fill="#cbd5e1"/>
  <rect x="110" y="30" width="10" height="20" rx="3" fill="#cbd5e1"/>
  <!-- Ports -->
  <rect x="80" y="105" width="40" height="8" rx="4" fill="#06b6d4"/>
  <!-- Power Icon -->
  <path d="M 100 68 L 92 82 L 101 82 L 98 96 L 109 80 L 100 80 Z" fill="#38bdf8"/>
</svg>

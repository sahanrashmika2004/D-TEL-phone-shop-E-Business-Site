<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- Samsung 25W Adapter Face -->
  <rect x="120" y="70" width="160" height="210" rx="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="200" y="115" fill="#38bdf8" font-family="'Outfit', sans-serif" font-weight="900" font-size="14" letter-spacing="1" text-anchor="middle">Super Fast Charging</text>
  <text x="200" y="135" fill="#f8fafc" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" text-anchor="middle">25W PD</text>
  <!-- Single USB-C 25W Port -->
  <rect x="155" y="160" width="90" height="34" rx="10" fill="#090d16" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="180" y="173" width="40" height="8" rx="4" fill="#38bdf8"/>
  <!-- Samsung Logo -->
  <text x="200" y="245" fill="#64748b" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" letter-spacing="3" text-anchor="middle">SAMSUNG</text>
  <!-- Label -->
  <rect x="80" y="345" width="240" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="200" y="366" fill="#38bdf8" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">25W COMPACT TYPE-C PORT</text>
</svg>

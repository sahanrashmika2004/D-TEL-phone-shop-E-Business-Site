<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- Luxury Retail Box in Perspective -->
  <g transform="rotate(-10 200 200)">
    <rect x="70" y="70" width="260" height="240" rx="16" fill="#18181b" stroke="#eab308" stroke-width="2.5"/>
    <rect x="85" y="85" width="230" height="210" rx="10" fill="#090d16" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
    <!-- Gold Foil Typography -->
    <text x="200" y="160" fill="#eab308" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" letter-spacing="4" text-anchor="middle">XIAOMI 14</text>
    <text x="200" y="195" fill="#f8fafc" font-family="'Outfit', sans-serif" font-weight="700" font-size="20" letter-spacing="6" text-anchor="middle">ULTRA</text>
    <!-- Leica Badge -->
    <rect x="150" y="225" width="100" height="26" rx="13" fill="#dc2626"/>
    <text x="200" y="243" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" letter-spacing="1" text-anchor="middle">LEICA CO-ENGINEERED</text>
  </g>
  <!-- Label -->
  <rect x="80" y="345" width="240" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="#f97316" stroke-width="1.5"/>
  <text x="200" y="366" fill="#f97316" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">PREMIUM PHOTOGRAPHY KIT BOX</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- 3D Perspective S24 Flat Frame -->
  <g transform="rotate(-15 200 200) translate(20, -10)">
    <rect x="100" y="40" width="190" height="320" rx="18" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
    <rect x="108" y="48" width="174" height="304" rx="10" fill="#020617"/>
    <!-- Flat Screen Edge Reflection -->
    <path d="M 112 52 L 278 52 L 190 348 L 112 348 Z" fill="rgba(255,255,255,0.06)"/>
    <!-- S-Pen Slot & Speaker Grille on Bottom -->
    <rect x="120" y="342" width="20" height="4" rx="2" fill="#38bdf8"/>
    <circle cx="260" cy="344" r="3" fill="#38bdf8"/>
  </g>
  <!-- Label -->
  <rect x="80" y="345" width="240" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="366" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">FLAT DISPLAY &amp; TITANIUM EDGE</text>
</svg>

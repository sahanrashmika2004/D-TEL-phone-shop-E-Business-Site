<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="miBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="miBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#miBg)"/>
  <!-- Phone Body -->
  <rect x="140" y="60" width="220" height="380" rx="32" fill="url(#miBody)" stroke="#475569" stroke-width="4"/>
  <!-- Giant Leica Camera Module -->
  <circle cx="250" cy="190" r="85" fill="#1e293b" stroke="#f59e0b" stroke-width="4"/>
  <circle cx="250" cy="190" r="75" fill="#090d16" stroke="#475569" stroke-width="2"/>
  <!-- 4 Lenses -->
  <circle cx="220" cy="165" r="18" fill="#000" stroke="#06b6d4" stroke-width="2"/>
  <circle cx="280" cy="165" r="18" fill="#000" stroke="#06b6d4" stroke-width="2"/>
  <circle cx="220" cy="215" r="18" fill="#000" stroke="#06b6d4" stroke-width="2"/>
  <circle cx="280" cy="215" r="18" fill="#000" stroke="#06b6d4" stroke-width="2"/>
  <!-- Leica Logo -->
  <rect x="230" y="185" width="40" height="12" rx="3" fill="#ef4444"/>
  <text x="250" y="194" font-family="sans-serif" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle">Leica</text>
  <!-- Text on Phone -->
  <text x="250" y="380" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" fill="#94a3b8" text-anchor="middle">XIAOMI 14 ULTRA</text>
</svg>

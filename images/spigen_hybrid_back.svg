<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- Crystal Clear Back with White Magnetic MagFit Ring -->
  <rect x="95" y="30" width="210" height="340" rx="34" fill="rgba(255,255,255,0.04)" stroke="#a855f7" stroke-width="2.5"/>
  <!-- Spigen MagFit Ring -->
  <circle cx="200" cy="180" r="46" fill="none" stroke="#ffffff" stroke-width="4"/>
  <rect x="197" y="230" width="6" height="22" rx="3" fill="#ffffff"/>
  <!-- Spigen Logo Branding -->
  <text x="200" y="320" fill="#a855f7" font-family="'Outfit', sans-serif" font-weight="900" font-size="14" letter-spacing="3" text-anchor="middle">spigen</text>
  <text x="200" y="338" fill="#c084fc" font-family="'Outfit', sans-serif" font-weight="600" font-size="10" text-anchor="middle">ULTRA HYBRID MAGFIT</text>
  <!-- Label -->
  <rect x="80" y="345" width="240" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="#a855f7" stroke-width="1.5"/>
  <text x="200" y="366" fill="#c084fc" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">CRYSTAL CLEAR MAGFIT BACK</text>
</svg>

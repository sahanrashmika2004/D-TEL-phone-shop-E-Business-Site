<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- Left Earbud -->
  <g transform="translate(100, 70) rotate(-15 50 100)">
    <circle cx="50" cy="50" r="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <ellipse cx="65" cy="40" rx="14" ry="18" fill="#e2e8f0"/>
    <rect x="42" y="70" width="16" height="75" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Force Sensor Indentation -->
    <rect x="44" y="95" width="12" height="25" rx="4" fill="#f1f5f9"/>
    <!-- Acoustic Vent Grille -->
    <rect x="35" y="45" width="8" height="12" rx="4" fill="#0f172a"/>
  </g>
  <!-- Right Earbud -->
  <g transform="translate(220, 70) rotate(15 50 100)">
    <circle cx="50" cy="50" r="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <ellipse cx="35" cy="40" rx="14" ry="18" fill="#e2e8f0"/>
    <rect x="42" y="70" width="16" height="75" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Force Sensor Indentation -->
    <rect x="44" y="95" width="12" height="25" rx="4" fill="#f1f5f9"/>
    <!-- Acoustic Vent Grille -->
    <rect x="57" y="45" width="8" height="12" rx="4" fill="#0f172a"/>
  </g>
  <!-- H2 Chip & ANC Badge -->
  <rect x="110" y="270" width="180" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="#ffffff" stroke-width="1.5"/>
  <text x="200" y="292" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" text-anchor="middle">H2 CHIP • 2X ANC BUDS</text>
  <!-- Label -->
  <rect x="80" y="345" width="240" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="#ffffff" stroke-width="1.5"/>
  <text x="200" y="366" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">DUAL BUDS &amp; FORCE SENSORS</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- Retail Packaging in Perspective -->
  <g transform="rotate(-6 200 200)">
    <rect x="80" y="50" width="240" height="280" rx="14" fill="#ffffff" stroke="#06b6d4" stroke-width="2.5"/>
    <rect x="80" y="50" width="240" height="35" rx="14" fill="#06b6d4"/>
    <text x="200" y="74" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" letter-spacing="2" text-anchor="middle">ANKER</text>
    <text x="200" y="125" fill="#0f172a" font-family="'Outfit', sans-serif" font-weight="900" font-size="18" text-anchor="middle">PowerLine II</text>
    <text x="200" y="145" fill="#64748b" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle">Lightning to USB-C Cable (1.2m)</text>
    <rect x="110" y="170" width="180" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="200" y="210" fill="#06b6d4" font-family="'Outfit', sans-serif" font-weight="800" font-size="13" text-anchor="middle">PD Fast Charging</text>
    <text x="200" y="235" fill="#1e293b" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" text-anchor="middle">12,000+ Bends Lifespan</text>
  </g>
  <!-- Label -->
  <rect x="80" y="345" width="240" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="200" y="366" fill="#06b6d4" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">MFi OFFICIAL RETAIL BOX</text>
</svg>

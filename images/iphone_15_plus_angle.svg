<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- Angled View with USB-C Port Close-Up -->
  <g transform="rotate(-10 200 200) translate(20, -10)">
    <rect x="100" y="40" width="190" height="320" rx="36" fill="#0284c7" stroke="#bae6fd" stroke-width="2.5"/>
    <rect x="108" y="48" width="174" height="304" rx="28" fill="#020617"/>
    <!-- Dynamic Island -->
    <rect x="160" y="65" width="70" height="18" rx="9" fill="#000"/>
    <!-- Bottom Contoured Edge with USB-C Port Highlight -->
    <rect x="175" y="340" width="40" height="8" rx="4" fill="#38bdf8"/>
    <!-- Speaker Holes -->
    <circle cx="140" cy="344" r="2" fill="#bae6fd"/>
    <circle cx="150" cy="344" r="2" fill="#bae6fd"/>
    <circle cx="160" cy="344" r="2" fill="#bae6fd"/>
    <circle cx="230" cy="344" r="2" fill="#bae6fd"/>
    <circle cx="240" cy="344" r="2" fill="#bae6fd"/>
    <circle cx="250" cy="344" r="2" fill="#bae6fd"/>
  </g>
  <!-- Label -->
  <rect x="80" y="345" width="240" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="200" y="366" fill="#38bdf8" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">CONTOURED EDGE &amp; USB-C PORT</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- Coiled 2m Double Braided Cable -->
  <ellipse cx="200" cy="180" rx="95" ry="95" fill="none" stroke="#334155" stroke-width="18"/>
  <ellipse cx="200" cy="180" rx="75" ry="75" fill="none" stroke="#475569" stroke-width="16"/>
  <ellipse cx="200" cy="180" rx="55" ry="55" fill="none" stroke="#1e293b" stroke-width="14"/>
  <!-- Silicone Cable Organizer Strap -->
  <rect x="185" y="80" width="30" height="190" rx="10" fill="#06b6d4"/>

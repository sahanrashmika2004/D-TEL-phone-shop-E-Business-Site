<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- Heavy Duty Braided Cable & Aluminum Tip -->
  <g transform="rotate(35 200 200)">
    <!-- Braided Cord -->
    <rect x="188" y="20" width="24" height="150" rx="6" fill="#334155" stroke="#475569" stroke-width="2"/>
    <!-- Reinforced Strain Relief -->
    <rect x="184" y="160" width="32" height="40" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <!-- Anodized Aluminum Connector Shell -->
    <rect x="180" y="200" width="40" height="70" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="200" y="240" fill="#06b6d4" font-family="'Outfit', sans-serif" font-weight="900" font-size="10" text-anchor="middle">100W</text>
    <!-- Gold Plated USB-C Plug -->
    <rect x="188" y="270" width="24" height="45" rx="5" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
  </g>
  <!-- Label -->
  <rect x="80" y="345" width="240" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="200" y="366" fill="#06b6d4" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">100W GOLD-PLATED TYPE-C TIP</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="geminiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- Angled Pixel with Gemini AI Interface -->
  <g transform="rotate(-15 200 200) translate(15, -10)">
    <rect x="100" y="40" width="190" height="320" rx="32" fill="#0f172a" stroke="#64748b" stroke-width="2.5"/>
    <rect x="110" y="50" width="170" height="300" rx="24" fill="#020617"/>
    <!-- Gemini Wave Animation -->
    <path d="M 120 200 Q 155 160 195 200 T 270 200" fill="none" stroke="url(#geminiGlow)" stroke-width="4"/>
    <circle cx="195" cy="200" r="40" fill="url(#geminiGlow)" opacity="0.15"/>
    <text x="195" y="240" fill="#38bdf8" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" text-anchor="middle">Gemini Pro</text>
  </g>
  <!-- Label -->
  <rect x="80" y="345" width="240" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="url(#geminiGlow)" stroke-width="1.5"/>
  <text x="200" y="366" fill="#818cf8" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">SUPER ACTUA &amp; GEMINI LIVE AI</text>
</svg>

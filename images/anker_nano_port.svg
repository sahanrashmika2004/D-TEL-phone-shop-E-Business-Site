<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- Front Face of Anker Nano 30W -->
  <rect x="120" y="80" width="160" height="180" rx="24" fill="#0f172a" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="200" y="125" fill="#06b6d4" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" text-anchor="middle">PowerIQ 3.0</text>
  <!-- Single Nano USB-C Port -->
  <rect x="155" y="150" width="90" height="34" rx="8" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="180" y="163" width="40" height="8" rx="4" fill="#06b6d4"/>
  <text x="200" y="210" fill="#94a3b8" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" text-anchor="middle">30W GaN</text>
  <!-- Label -->
  <rect x="80" y="345" width="240" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="#06b6d4" stroke-width="1.5"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- Front Face of Baseus GaN3 Pro -->
  <rect x="110" y="50" width="180" height="280" rx="20" fill="#18181b" stroke="#eab308" stroke-width="2.5"/>
  <!-- Baseus Glow Logo & LED Indicator -->
  <circle cx="200" cy="80" r="5" fill="#38bdf8"/>
  <text x="200" y="105" fill="#eab308" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" text-anchor="middle">Baseus GaN3</text>
  <!-- Port 1 (Type-C1 65W) -->
  <rect x="150" y="125" width="100" height="34" rx="8" fill="#090d16" stroke="#eab308" stroke-width="1.5"/>
  <rect x="180" y="138" width="40" height="8" rx="4" fill="#eab308"/>
  <text x="200" y="170" fill="#a1a1aa" font-family="'Outfit', sans-serif" font-weight="700" font-size="9" text-anchor="middle">Type-C 1 (65W)</text>
  <!-- Port 2 (Type-C2 65W) -->
  <rect x="150" y="185" width="100" height="34" rx="8" fill="#090d16" stroke="#eab308" stroke-width="1.5"/>
  <rect x="180" y="198" width="40" height="8" rx="4" fill="#eab308"/>
  <text x="200" y="230" fill="#a1a1aa" font-family="'Outfit', sans-serif" font-weight="700" font-size="9" text-anchor="middle">Type-C 2 (65W)</text>
  <!-- Port 3 (USB-A QC 60W) -->
  <rect x="150" y="245" width="100" height="34" rx="8" fill="#090d16" stroke="#eab308" stroke-width="1.5"/>
  <rect x="165" y="255" width="70" height="14" rx="3" fill="#f97316"/>
  <text x="200" y="290" fill="#a1a1aa" font-family="'Outfit', sans-serif" font-weight="700" font-size="9" text-anchor="middle">USB (QC 60W)</text>
  <!-- Label -->
  <rect x="80" y="345" width="240" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="#eab308" stroke-width="1.5"/>
  <text x="200" y="366" fill="#eab308" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">BASEUS BPS II FAST CHARGING</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="podBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#podBg)"/>
  <!-- AirPods Case Body -->
  <g filter="url(#shadow)">
    <rect x="140" y="180" width="220" height="170" rx="45" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4"/>
    <line x1="140" y1="235" x2="360" y2="235" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="250" cy="275" r="5" fill="#10b981"/>
    <!-- Speaker Grille -->
    <rect x="235" y="338" width="30" height="4" rx="2" fill="#94a3b8"/>
  </g>
  <!-- Left Earbud -->
  <g filter="url(#shadow)">
    <path d="M 170 120 C 170 90 200 90 205 115 L 195 180 Z" fill="#ffffff"/>
    <ellipse cx="185" cy="110" rx="22" ry="18" fill="#f8fafc"/>
    <ellipse cx="172" cy="110" rx="6" ry="12" fill="#94a3b8"/>
    <rect x="180" y="125" width="10" height="4" rx="2" fill="#334155"/>
  </g>
  <!-- Right Earbud -->
  <g filter="url(#shadow)">
    <path d="M 330 120 C 330 90 300 90 295 115 L 305 180 Z" fill="#ffffff"/>
    <ellipse cx="315" cy="110" rx="22" ry="18" fill="#f8fafc"/>
    <ellipse cx="328" cy="110" rx="6" ry="12" fill="#94a3b8"/>
    <rect x="310" y="125" width="10" height="4" rx="2" fill="#334155"/>
  </g>
</svg>

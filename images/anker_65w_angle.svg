<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- 3D Angled View with Folded Plug Prongs -->
  <g transform="rotate(-20 200 200) translate(20, -10)">
    <rect x="90" y="80" width="180" height="220" rx="20" fill="#1e293b" stroke="#06b6d4" stroke-width="2.5"/>
    <rect x="100" y="90" width="160" height="200" rx="14" fill="#0f172a"/>
    <!-- Folded Metal Prongs -->
    <rect x="75" y="110" width="20" height="40" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="75" y="170" width="20" height="40" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Anker Logo -->
    <text x="180" y="195" fill="#06b6d4" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" letter-spacing="2" text-anchor="middle">ANKER</text>
    <text x="180" y="225" fill="#94a3b8" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" letter-spacing="1" text-anchor="middle">GaNPrime 65W</text>
  </g>
  <!-- Label -->
  <rect x="80" y="345" width="240" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="200" y="366" fill="#06b6d4" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">FOLDABLE PRONGS &amp; GaN PROFILE</text>
</svg>

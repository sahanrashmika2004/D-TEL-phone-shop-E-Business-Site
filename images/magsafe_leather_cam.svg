<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- Camera Ring & Machined Buttons Profile -->
  <g transform="rotate(-15 200 200) translate(20, -10)">
    <rect x="90" y="40" width="200" height="320" rx="34" fill="#7c2d12" stroke="#ea580c" stroke-width="3"/>
    <!-- Raised Beveled Camera Lip -->
    <rect x="105" y="55" width="95" height="95" rx="22" fill="#431407" stroke="#fb923c" stroke-width="2.5"/>
    <text x="152" y="110" fill="#fb923c" font-family="'Outfit', sans-serif" font-weight="900" font-size="12" text-anchor="middle">RAISED LIP</text>
    <!-- Machined Aluminum Volume & Action Buttons -->
    <rect x="84" y="90" width="6" height="20" rx="3" fill="#fdba74"/>
    <rect x="84" y="125" width="6" height="30" rx="3" fill="#fdba74"/>
    <rect x="84" y="165" width="6" height="30" rx="3" fill="#fdba74"/>
  </g>
  <!-- Label -->
  <rect x="80" y="345" width="240" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="#ea580c" stroke-width="1.5"/>
  <text x="200" y="366" fill="#fb923c" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">MACHINED BUTTONS &amp; CAMERA LIP</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="s24Gray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- Phone Body -->
  <rect x="95" y="30" width="210" height="340" rx="20" fill="url(#s24Gray)" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Quad Camera Array -->
  <circle cx="135" cy="80" r="22" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="135" cy="80" r="14" fill="#020617"/>
  <circle cx="135" cy="135" r="22" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="135" cy="135" r="14" fill="#020617"/>
  <circle cx="135" cy="190" r="22" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="135" cy="190" r="14" fill="#020617"/>
  <!-- Side Sensors -->
  <circle cx="180" cy="80" r="12" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <circle cx="180" cy="110" r="7" fill="#fef08a"/>
  <circle cx="180" cy="140" r="14" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
  <!-- Samsung Logo -->
  <text x="200" y="325" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" letter-spacing="4" text-anchor="middle">SAMSUNG</text>
  <!-- Label -->
  <rect x="80" y="345" width="240" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="366" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">TITANIUM GRAY SATIN FINISH</text>
</svg>

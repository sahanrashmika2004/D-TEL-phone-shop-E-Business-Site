<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="sonyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="silverTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="300" height="300" rx="36" fill="url(#sonyBg)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <!-- Headband Arc -->
  <path d="M 70 170 C 65 60, 235 60, 230 170" fill="none" stroke="#334155" stroke-width="22" stroke-linecap="round"/>
  <path d="M 85 150 C 85 85, 215 85, 215 150" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
  <!-- Headband Soft Cushion -->
  <path d="M 105 105 C 120 95, 180 95, 195 105" fill="none" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <!-- Left Ear Cup -->
  <g transform="translate(40, 140)">
    <rect x="0" y="0" width="55" height="85" rx="26" fill="#1e293b" stroke="url(#silverTrim)" stroke-width="2.5" filter="url(#glow)"/>
    <ellipse cx="27" cy="42" rx="20" ry="32" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="27" cy="42" r="6" fill="url(#goldAccent)"/>
  </g>
  <!-- Right Ear Cup -->
  <g transform="translate(205, 140)">
    <rect x="0" y="0" width="55" height="85" rx="26" fill="#1e293b" stroke="url(#silverTrim)" stroke-width="2.5" filter="url(#glow)"/>
    <ellipse cx="27" cy="42" rx="20" ry="32" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="27" cy="42" r="6" fill="url(#goldAccent)"/>
  </g>
  <!-- Sony / ANC Badge -->
  <rect x="95" y="245" width="110" height="26" rx="13" fill="rgba(245,158,11,0.15)" stroke="url(#goldAccent)" stroke-width="1.5"/>
  <text x="150" y="262" fill="#f59e0b" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" text-anchor="middle" letter-spacing="1">SONY ANC • LDAC</text>
</svg>

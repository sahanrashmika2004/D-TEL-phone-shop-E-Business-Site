<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="leicaDial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="85%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- Phone Body -->
  <rect x="95" y="30" width="210" height="340" rx="30" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
  <!-- Massive Leica Circular Camera Island -->
  <circle cx="200" cy="140" r="75" fill="url(#leicaDial)" stroke="#eab308" stroke-width="3"/>
  <circle cx="200" cy="140" r="68" fill="#090d16"/>
  <!-- 4 Lenses Array -->
  <circle cx="175" cy="120" r="16" fill="#18181b" stroke="#71717a" stroke-width="1.5"/>
  <circle cx="225" cy="120" r="16" fill="#18181b" stroke="#71717a" stroke-width="1.5"/>
  <circle cx="175" cy="160" r="16" fill="#18181b" stroke="#71717a" stroke-width="1.5"/>
  <circle cx="225" cy="160" r="16" fill="#18181b" stroke="#71717a" stroke-width="1.5"/>
  <!-- Leica Red Dot Logo -->
  <rect x="180" y="132" width="40" height="16" rx="3" fill="#dc2626"/>
  <text x="200" y="144" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="10" text-anchor="middle">Leica</text>
  <!-- Xiaomi Logo -->
  <text x="200" y="325" fill="#f97316" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" letter-spacing="2" text-anchor="middle">xiaomi</text>
  <!-- Label -->
  <rect x="80" y="345" width="240" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="#f97316" stroke-width="1.5"/>
  <text x="200" y="366" fill="#f97316" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">LEICA 1-INCH QUAD OPTICS</text>
</svg>

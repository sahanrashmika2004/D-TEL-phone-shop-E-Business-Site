<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- Mini Thumb Sized 30W Adapter in 3D Angle -->
  <g transform="rotate(-15 200 200) translate(20, -10)">
    <rect x="110" y="90" width="140" height="150" rx="16" fill="#1e293b" stroke="#06b6d4" stroke-width="2.5"/>
    <rect x="95" y="110" width="18" height="35" rx="3" fill="#cbd5e1"/>
    <rect x="95" y="160" width="18" height="35" rx="3" fill="#cbd5e1"/>
    <text x="180" y="165" fill="#06b6d4" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" letter-spacing="1" text-anchor="middle">ANKER</text>
    <text x="180" y="190" fill="#94a3b8" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" text-anchor="middle">Nano 30W</text>
  </g>
  <!-- 70% Smaller Comparison Badge -->
  <rect x="120" y="270" width="160" height="30" rx="15" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="200" y="290" fill="#38bdf8" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" text-anchor="middle">70% SMALLER SIZE</text>
  <!-- Label -->
  <rect x="80" y="345" width="240" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="200" y="366" fill="#06b6d4" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">THUMB-SIZED COMPACT GaN</text>
</svg>

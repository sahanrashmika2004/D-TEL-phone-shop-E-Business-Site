<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#090d16" rx="28"/>
  <!-- Charger Block -->
  <rect x="70" y="80" width="130" height="180" rx="16" fill="#18181b" stroke="#38bdf8" stroke-width="2"/>
  <text x="135" y="150" fill="#38bdf8" font-family="'Outfit', sans-serif" font-weight="900" font-size="14" text-anchor="middle">45W GaN</text>
  <text x="135" y="175" fill="#64748b" font-family="'Outfit', sans-serif" font-weight="700" font-size="10" text-anchor="middle">SAMSUNG</text>
  <!-- Coiled 5A Type-C to Type-C Cable -->
  <circle cx="270" cy="170" r="65" fill="none" stroke="#334155" stroke-width="12"/>
  <circle cx="270" cy="170" r="50" fill="none" stroke="#475569" stroke-width="10"/>
  <!-- 5A Cable Tip Highlight -->
  <rect x="250" y="70" width="40" height="16" rx="5" fill="#38bdf8"/>
  <rect x="260" y="58" width="20" height="12" rx="3" fill="#cbd5e1"/>

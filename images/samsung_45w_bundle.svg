  <rect x="230" y="240" width="80" height="26" rx="13" fill="#0284c7"/>
  <text x="270" y="258" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="11" text-anchor="middle">5A CABLE INCLUDED</text>
  <!-- Label -->
  <rect x="80" y="345" width="240" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="200" y="366" fill="#38bdf8" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">CHARGER + 5A C-TO-C BUNDLE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="hubBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="36" fill="url(#hubBg)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <!-- Braided Cable -->
  <path d="M 60 70 Q 110 50 140 100" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
  <!-- Type-C Connector Head -->
  <rect x="35" y="60" width="28" height="18" rx="4" fill="url(#metal)" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="25" y="64" width="10" height="10" rx="2" fill="#cbd5e1"/>
  <!-- Main Hub Body -->
  <rect x="110" y="90" width="90" height="170" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="118" y="98" width="74" height="154" rx="10" fill="#0f172a"/>
  <!-- Ports on Hub Face -->
  <!-- USB 3.0 Port 1 (Blue) -->
  <rect x="130" y="115" width="50" height="14" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
  <!-- USB 3.0 Port 2 (Blue) -->
  <rect x="130" y="138" width="50" height="14" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
  <!-- HDMI 4K Port -->
  <rect x="132" y="162" width="46" height="16" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
  <!-- SD / TF Slots -->
  <rect x="135" y="190" width="40" height="6" rx="2" fill="#475569"/>
  <rect x="140" y="202" width="30" height="4" rx="1" fill="#475569"/>
  <!-- PD 100W Port -->
  <rect x="138" y="218" width="34" height="10" rx="5" fill="#f59e0b"/>
  <!-- Anker Text -->
  <text x="155" y="244" fill="#94a3b8" font-family="'Outfit', sans-serif" font-weight="700" font-size="9" text-anchor="middle" letter-spacing="1">ANKER 7-IN-1</text>
</svg>
